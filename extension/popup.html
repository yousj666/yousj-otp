<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 340px; font-family: system-ui, "PingFang SC", "Microsoft YaHei", sans-serif;
         background: #1a1a1a; color: #e8e8e8; }
  header { padding: 12px 14px; background: #222; display: flex; align-items: center;
           justify-content: space-between; border-bottom: 1px solid #333; }
  header h1 { font-size: 15px; font-weight: 600; }
  header h1 span { color: #f5a623; }
  #addBtn { background: #f5a623; border: none; color: #1a1a1a; font-weight: 700;
            width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 16px; }
  #list { max-height: 380px; overflow-y: auto; padding: 8px; }
  .card { background: #262626; border-radius: 10px; padding: 10px 12px; margin-bottom: 8px;
          display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
  .card:hover { background: #2e2e2e; }
  .card .name { font-size: 13px; color: #aaa; margin-bottom: 2px; }
  .card .code { font-size: 24px; font-weight: 700; letter-spacing: 3px; font-family: Consolas, monospace; }
  .card .del { color: #666; font-size: 16px; padding: 4px 6px; cursor: pointer; }
  .card .del:hover { color: #ff6b6b; }
  .card .edit { color: #666; font-size: 14px; padding: 4px 6px; cursor: pointer; }
  .card .edit:hover { color: #f5a623; }
  .ring { width: 34px; height: 34px; flex-shrink: 0; margin-left: 8px; }
  .empty { text-align: center; color: #666; padding: 40px 20px; font-size: 13px; line-height: 1.8; }
  /* 添加面板 */
  #addPanel { display: none; padding: 12px 14px; border-top: 1px solid #333; background: #222; }
  #addPanel.show { display: block; }
  #addPanel input[type=text] { width: 100%; padding: 8px; margin-bottom: 8px; border-radius: 6px;
    border: 1px solid #444; background: #1a1a1a; color: #e8e8e8; font-size: 13px; }
  #addPanel .row { display: flex; gap: 8px; }
  #addPanel button { flex: 1; padding: 8px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px; }
  #btnManual { background: #f5a623; color: #1a1a1a; font-weight: 600; }
  #btnQR { background: #333; color: #e8e8e8; }
  #qrInput { display: none; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #f5a623; color: #1a1a1a; padding: 6px 16px; border-radius: 20px;
    font-size: 13px; font-weight: 600; opacity: 0; transition: opacity .2s; pointer-events: none; }
</style>
</head>
<body>
<header>
  <h1><span>Yousj</span> OTP</h1>
  <button id="addBtn" title="添加账号">+</button>
</header>
<div id="addPanel">
  <input type="text" id="inpName" placeholder="名字（如：GitHub）">
  <input type="text" id="inpSecret" placeholder="密钥（Base32，可手动填）">
  <input type="text" id="inpPeriod" placeholder="时长（秒，默认 15，可改）">
  <div class="row">
    <button id="btnManual">手动添加</button>
    <button id="btnQR">上传二维码图片</button>
  </div>
  <input type="file" id="qrInput" accept="image/*">
</div>
<div id="list"></div>
<div id="toast">已复制</div>
<script src="jsqr.min.js"></script>
<script src="popup.js"></script>
</body>
</html>
